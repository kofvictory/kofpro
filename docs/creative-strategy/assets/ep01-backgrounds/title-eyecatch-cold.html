<title>コフと僕 EP01 ｜ タイトルアイキャッチ cold（0%残像・トランジション入口）</title>
<style>
  /* =========================================================================
     EP01 タイトルアイキャッチ cold : ⓪→①の橋(冷・入口)
     構成: ⓪コールドオープン(冷/0%) →暗転→ [cold(これ)] →(冷→暖クロスフェード)→ [warm] →①
     ★cold=deep-tense背景の温度=「0%の緊張の残像」を一瞬引きずった状態でタイトル立ち上げ。
     ★warmと同一レイアウト・同一文字=CapCutでcold→warmにクロスフェード=冷→暖の橋になる。
     ★縁に淡いクリムゾン(0%の警戒)。文字は冷たい白+影で暗背景から確保。
     ★1920x1080・IPセーフ(抽象のみ)。単体で使わず、warmへ渡す入口フレーム。
     ========================================================================= */
  :root{
    --ground-a:#08070f; --ground-b:#060510; --ground-c:#040309;
    --grid:rgba(181,170,224,1); --grid-op:0.03;
    --g1c:rgba(95,214,192,0.05); --g1pos:60% 26%; --g1size:40% 44%;
    --g2c:rgba(192,67,90,0.09); --g2pos:82% 82%;
    --vig:rgba(46,10,20,0.92); --vig-edge:rgba(30,6,14,0.82);
    --ink:#eef1f6; --ink-dim:#b9c2d0; --teal:#7fe3d0;
    --title-glow:rgba(150,175,205,0.18);
  }
  html,body{margin:0;padding:0;background:var(--ground-c);}
  body{width:1920px;height:1080px;overflow:hidden;position:relative;
    font-family:"Noto Serif CJK JP","Noto Serif JP",serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  .layer{position:absolute;inset:0;pointer-events:none;}
  .ground{background:radial-gradient(120% 105% at 50% 40%, var(--ground-a) 0%, var(--ground-b) 52%, var(--ground-c) 100%);}
  .glow{background:
    radial-gradient(var(--g1size) at var(--g1pos), var(--g1c), transparent 62%),
    radial-gradient(52% 54% at var(--g2pos), var(--g2c), transparent 60%);}
  .grid{opacity:var(--grid-op);
    background-image:
      repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 68px),
      repeating-linear-gradient(0deg,  var(--grid) 0 1px, transparent 1px 68px);
    -webkit-mask-image:radial-gradient(115% 92% at 50% 38%, #000 14%, transparent 76%);
            mask-image:radial-gradient(115% 92% at 50% 38%, #000 14%, transparent 76%);}
  .vignette{box-shadow:inset 0 0 360px 90px var(--vig);
    background:radial-gradient(120% 116% at 50% 46%, transparent 52%, var(--vig-edge) 100%);}

  /* ===== タイトルブロック(warmと同一レイアウト) ===== */
  .card{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:40px;}
  .series{display:flex;align-items:center;gap:26px;
    font-family:"Noto Sans CJK JP",sans-serif;
    font-size:30px;font-weight:700;letter-spacing:.44em;text-indent:.44em;}
  .series .ep{color:var(--teal);}
  .series .ch{color:var(--ink-dim);}
  .series .sep{width:9px;height:9px;border:1.5px solid rgba(127,227,208,.6);
    transform:rotate(45deg);}
  .title{font-weight:700;color:var(--ink);
    font-size:120px;line-height:1.34;letter-spacing:.05em;
    text-shadow:0 3px 40px var(--title-glow), 0 2px 6px rgba(0,0,0,.7);}
  .under{width:150px;height:2px;margin-top:6px;
    background:linear-gradient(90deg, transparent, var(--teal), transparent);
    box-shadow:0 0 18px 1px rgba(127,227,208,.4);}
</style>
<div class="layer ground"></div>
<div class="layer glow"></div>
<div class="layer grid"></div>
<div class="layer vignette"></div>
<div class="card">
  <div class="series"><span class="ep">EP.01</span><span class="sep"></span><span class="ch">コフと僕</span></div>
  <div class="title">憧れの相棒AIを<br>本気で自作してみる！</div>
  <div class="under"></div>
</div>
